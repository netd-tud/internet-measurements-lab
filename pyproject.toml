[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "internet_measurement_lab"
version = "0.0.1"
description = "IM lab"
authors = [
  { name = "NETD" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"
dependencies = [
    "loguru>=0.8.0",
    "marimo>=0.25.2",
    "polars[all]>=2.1.0",
    "pysubnettree>=0.38.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.5",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["internet_measurement_lab"]
force_sort_within_sections = true


